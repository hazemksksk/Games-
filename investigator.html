<script>

const T=['المقدمة','مسرح الجريمة','الأدلة','الشهود','الفحوصات والكشوف','ملفات المشتبه بهم','غرفة التحقيق','لوحة الأدلة','الاتهام','دعم المحقق','من نحن','اتصل بنا'];
let Q=['أين كنت بين الخامسة والسابعة مساءً؟','ما طبيعة علاقتك بالضحية؟','هل كان لسالم أعداء؟','ماذا تعرف عن التحويلات المالية؟','هل رأيت أو سمعت شيئاً قرب الزقاق؟','لماذا ينبغي أن نصدقك؟'];
let M=['اختلاس أموال الشركة وإخفاء الجريمة','خلاف على النفقة والحضانة','دَين مالي متأخر','انتقام من الفصل التعسفي','ابتزاز الضحية'];
let D=[
{n:'ماجد الشمري',role:'شريك الضحية في التجارة',bio:['العمر: 45 سنة','شريك سالم منذ اثني عشر عاماً ويدير المشتريات','يقود سيارة «كامري» بيضاء','يملك مفتاحاً احتياطياً لجميع غرف المحل','متزوج وله ثلاثة أبناء؛ لا سوابق جنائية'],sec:'أنت القاتل: اختلست 480 ألفاً عبر شركة الأفق للتوريد التي تملكها سراً، وسالم اكتشف ذلك وحدد معك موعداً السادسة خلف المحل، فأخذت مسدس نادر من خزانته بمفتاحك الاحتياطي وقتلته، وسيارتك البيضاء دخلت الزقاق 6:02. تكذب بشأن النادي الرياضي ولا تعترف إلا إذا حوصرت بأدلة قاطعة.',a:['كنت في النادي الرياضي حتى السابعة، واسألوا المدرب.','شريكه منذ اثني عشر عاماً، وكان أخي قبل أن يكون شريكاً.','لا أعرف له عدواً، سوى دائنين يطالبونه بأموالهم.','صفقات توريد اعتيادية، والمحاسبة أدرى بتفاصيلها.','لا شيء، فلم أقترب من ذلك الزقاق منذ أسابيع.','لأنني أكثر المتضررين من موته.']},
{n:'هدى العتيبي',role:'طليقة الضحية',bio:['العمر: 38 سنة','انفصلا قبل ثلاث سنوات ولهما ابنة','تطالب بنفقة متأخرة','تعمل معلمة في مدرسة ابتدائية','زارت المحل ظهر الخميس'],sec:'أنت بريئة. زرت المحل الرابعة عصراً وتشاجرت مع سالم بسبب النفقة ثم غادرت وبقيت في البيت مع ابنتك. لا تعلمين شيئاً عن الحسابات.',a:['كنت في البيت مع ابنتي، ولا شاهد سواها.','طليقته، وبيننا ابنة وخلافات على النفقة.','كثيرون، لكنه لم يشكُ لي يوماً.','لا أعلم عن حساباته شيئاً سوى أنه تأخر في النفقة.','مررت بالمحل عند الرابعة وتشاجرنا ثم غادرت.','لأنني أعترف بالشجار ولا أخفيه.']},
{n:'ياسر القحطاني',role:'مورّد التحف',bio:['العمر: 52 سنة','يورّد التحف للمحل منذ سنوات','عليه دَين متأخر للضحية','يقود شاحنة رمادية','سُجل عليه نزاع تجاري قديم دون إدانة'],sec:'أنت بريء. كنت في شمال جدة تسلّم بضاعة حتى السابعة (فاتورة 6:05). استلمت دفعة 15 ألفاً من شركة الأفق ولا تعرف صاحبها.',a:['كنت أسلّم بضاعة في شمال جدة، وعندي فاتورة بالتوقيت.','أورّد له منذ سنوات، وله عندي مبلغ متأخر.','اختلف مع كثيرين على الأسعار، ومعي أنا أيضاً.','استلمت دفعة خمسة عشر ألفاً من شركة الأفق ولا أعرف مالكها.','لا.','فاتورتي تثبت مكاني.']},
{n:'نادر السبيعي',role:'حارس سابق للمحل',bio:['العمر: 29 سنة','فُصل من عمله قبل أسبوع','يملك مسدساً مرخصاً عيار 38','أبلغ عن فقدان المسدس قبل أسبوع','هو من اتصل بالشرطة 6:40'],sec:'أنت بريء. جئت لتستلم مستحقاتك فوجدت سالم مقتولاً فاتصلت بالشرطة. مسدسك فُقد من خزانتك قبل أسبوع وأبلغت. رأيت سيارة بيضاء تخرج مسرعة ولم تتبين اللوحة.',a:['جئت لأستلم مستحقاتي فوجدته مقتولاً فاتصلت بالشرطة.','حارسه حتى فصلني قبل أسبوع بحجة التقليص.','لا أعرف، لكنه كان متوتراً مؤخراً بسبب الحسابات.','سمعته قبل أسبوعين يصرخ على ماجد بسبب أوراق.','رأيت سيارة بيضاء تخرج مسرعة من الزقاق ولم أتبين اللوحة.','مسدسي فُقد من خزانتي وأبلغت عنه، فلا دافع لي.']},
{n:'ليلى الدوسري',role:'محاسبة المحل',bio:['العمر: 33 سنة','تعمل في المحل منذ ثلاث سنوات','حاصلة على ماجستير محاسبة','أرسلت بريداً إلكترونياً 5:45 مساءً','طلب منها سالم ملف شركة الأفق'],sec:'أنت بريئة. كنت في البيت وأرسلت بريداً 5:45. سالم طلب منك ملف شركة الأفق ولم تجدي لها عقوداً، وقد نبّهته إلى الخلل.',a:['كنت في بيتي أُعدّ تقارير الحسابات، وبريدي مؤرّخ.','محاسبته منذ ثلاث سنوات.','الحسابات كانت تقلقه، وقال إنه سيواجه شخصاً ما.','طلب مني ملف شركة الأفق ولم أجد لها عقوداً.','لا.','لأنني من نبّه إلى الخلل أصلاً.']},
{n:'صالح الغامدي',role:'بائع شاي قرب الزقاق',bio:['العمر: 60 سنة','كشكه عند مدخل الزقاق منذ عشرين عاماً'],sec:'شاهد صادق: رأيت سيارة بيضاء تدخل الزقاق بعد السادسة بقليل وتخرج مسرعة، وسمعت دوياً.',a:['في كشكي عند فم الزقاق حتى الثامنة.','زبون دائم.','لا أعرف.','لا علم لي بالمال.','رأيت سيارة بيضاء تدخل بعد السادسة بقليل، وسمعت دوياً قبل أن تخرج مسرعة.','عمري ستون عاماً ولا مصلحة لي.']},
{n:'جميلة الزهراني',role:'جارة المحل',bio:['العمر: 50 سنة','تسكن فوق المحل','على خلاف قديم مع ياسر'],sec:'شاهدة كاذبة تحقد على ياسر: تدّعين أنك رأيته يركض في الزقاق قرابة السادسة، والحقيقة أنك لم تتبيني الشخص.',a:['في شرفتي أراقب الحي.','جارة المحل.','ياسر كان يتشاجر معه دائماً.','لا.','رأيت ياسر يركض في الزقاق قرابة السادسة.','لأنني رأيت بعيني.']},
{n:'فهد المطيري',role:'طالب عابر',bio:['العمر: 19 سنة','يمرّ بالزقاق يومياً عائداً من الدرس'],sec:'شاهد صادق: رأيت الحارس نادر عند الباب بعد السادسة والنصف يتصل بالهاتف. لا تعرف أكثر.',a:['كنت عائداً من الدرس.','لا أعرفه، أمرّ بالزقاق يومياً.','لا.','لا.','رأيت الحارس نادراً عند الباب بعد السادسة والنصف يتصل بالهاتف.','لا علاقة لي بهم.']}];
let EV=[['هاتف الضحية','آخر نشاط على الهاتف اتصال في 5:41 مساءً. الهاتف سليم ومكسور الغطاء فقط.'],['مفتاح خزانة','عُثر قرب مكتب الضحية على مفتاح احتياطي لخزانة الحراس، وعليه بصمة جزئية غير محسومة. لا يملك نسخاً منه إلا أصحاب المفاتيح الاحتياطية.'],['ساعة الضحية','ساعة يده متوقفة عند 6:11 وزجاجها مهشّم، مما يرجّح وقت الوفاة بعد السادسة بقليل.'],['دفتر المواعيد','آخر سطر مكتوب بخط الضحية: «6:00 — خلف المحل — ملف الأفق». لم يذكر اسم صاحب الموعد.'],['زجاجة عطر','زجاجة عطر نسائي مكسورة داخل المحل، ترجع إلى زيارة ظهرية، ولا صلة لها بوقت الجريمة.'],['فاتورة تسليم','فاتورة تسليم بضاعة في شمال جدة مختومة 6:05 مساءً وموقعة باسم ياسر القحطاني.']];
let FL=[['كشف الحساب البنكي (آخر أسبوع)','الأحد: تحويل 160,000 إلى «شركة الأفق للتوريد»|الثلاثاء: تحويل 150,000 إلى الشركة نفسها|الخميس: سحب نقدي 5,000|المجموع المحوّل خلال الأشهر الماضية إلى الشركة: 480,000 ريال|لا تحويلات إلى أي من الأسماء الأخرى'],['كشف الاتصالات (آخر أسبوع)','الأربعاء: 3 اتصالات مع ليلى (حسابات)|الخميس 4:10: هدى، 6 دقائق، نبرة عالية|الخميس 5:41: ماجد، 3 دقائق|الخميس 5:44: رسالة إلى ليلى: «أحتاج ملف الأفق»|لا اتصال بعد 5:44'],['تقرير الطب الشرعي','الوفاة بطلق ناري واحد في الصدر|المسافة: قريبة جداً (أقل من متر)|وقت الوفاة: بين 6:00 و6:20 مساءً|لا آثار مقاومة، فالضحية عرف قاتله|معدة الضحية: وجبة خفيفة قبل ساعتين|لا مخدرات ولا كحول'],['تقرير المقذوفات','المقذوف: عيار 38 ملم|مطابق لمسدس نادر السبيعي المسجل باسمه|المسدس لم يُعثر عليه|بلاغ الفقد بتاريخ قبل أسبوع|خزانة الحراس لا آثار كسر عليها، فتُفتح بمفتاح']];
let SOL='القاتل ماجد الشمري. اختلس 480 ألف ريال عبر «شركة الأفق»، وقد ظهر ذلك في الحساب البنكي وفي ملف ليلى. دفتر المواعيد وهاتف الضحية يدلان على موعد معه السادسة، وكاميرا الصيدلية سجلت سيارة بيضاء تدخل 6:02 وتخرج 6:19، وكذلك رأى صالح ونادر. المسدس سُرق من خزانة نادر بمفتاح احتياطي لا يملكه إلا ماجد. أما جميلة فكذبت على ياسر، وفاتورته تثبت وجوده في الشمال.';

cam:camc('CAM-01 بوابة الفيلا','2026-10-29 21:42:09','#444','مركبة داكنة تغادر البوابة 9:42 والإضاءة ضعيفة.'),
SOL:'القاتل عادل، محامي الضحية. اختلس من حساب الأمانة، وقد كشفه الضحية وسجّل ذلك في دفتره واتصل بالنقابة. الوصية وُقّعت 9:15 وسجل البوابة يثبت خروجه 9:42، فكذب حين قال إنه غادر 8:30. الفنجان الثاني المغسول يدل على ضيف شاركه الشراب، وصندوق الدواء فُتح بمفتاح لا يحمله إلا الضحية، أي في وجود ضيف في المكتب. أما خالد فشجاره كان السابعة، ومنى كانت في حفل مؤرخ.',
FL:[['تقرير الطب الشرعي','الوفاة بجرعة قاتلة من دواء القلب المعتاد للضحية|الوقت التقريبي: بين 9:30 و10:30 مساءً|لا إصابات ولا آثار مقاومة|الجرعة كانت مخلوطة بالقهوة|آخر وجبة: عشاء خفيف السابعة'],['كشف الحساب البنكي (أسبوع)','سحب أسبوعي معتاد 10,000|تحويل 200,000 من حساب الأمانة إلى حساب مكتب المحاماة قبل ثلاثة أيام|لا مبالغ مشبوهة لدى الورثة'],['كشف الاتصالات (أسبوع)','الأربعاء: اتصال بنقابة المحامين 4 دقائق|الخميس 6:40: اتصال بعادل ثم رسالة «تعال الليلة لتوقيع الوصية»|لا اتصالات بعد 8:00'],['تقرير الأدلة الجنائية','بصمات على الفنجان الأول للضحية فقط|بصمة جزئية على مقبض الدرج تحتاج مقارنة|الفنجان الثاني مغسول بلا بصمات']],
EV:[['الفنجانان','فنجانان على الطاولة، الأول فيه بقايا القهوة المسمومة، والثاني مغسول ومقلوب قرب المغسلة الصغيرة. يوحي بأن للضحية ضيفاً شاركه الشراب.'],['صندوق الدواء','صندوق دواء الضحية مفتوح وفارغ من جرعات الليل، بلا أثر كسر، ومفتاحه كان في جيب الضحية.'],['الوصية الجديدة','وصية موقعة 9:15 مساءً تحرم المحامي من منصب المنفذ وتوزع أغلب المال على جمعيات خيرية. لا شاهد عليها سوى المحامي.'],['سجل البوابة','دخول المحامي 8:10، خروجه 9:42، دخول خالد 11:00، دخول منى 11:35، ولا زوار آخرين بعد 9:42.'],['ورقة من دفتر الضحية','ملاحظة بخط الضحية: «راجع حساب الأمانة — فروق غير مفهومة — اتصل بالنقابة». لم يُذكر اسم.']],
D:[P('خالد الفاسي','ابن الضحية','العمر: 34 سنة|ابنه الوحيد من زوجته الأولى|يعتمد على مصروف أبيه|تشاجر معه السابعة مساءً|لا سوابق','بريء. تشاجرت مع أبيك السابعة بسبب نفقاتك ثم خرجت إلى المقهى وعدت 11:00. لا تعلم تفاصيل الوصية.',['في المقهى مع أصدقائي، وعدت قرابة الحادية عشرة.','ابنه الوحيد من زوجته الأولى.','تشاجرنا السابعة بسبب نفقاتي، ولا خلاف غير ذلك.','لا، فقد خرجت مبكراً.','لأن أصدقائي والنادل يشهدون.']),
P('منى الفاسي','زوجة الضحية','العمر: 40 سنة|زوجته الثانية منذ ست سنوات|كان ينوي تقليل مصروفها|حضرت حفل عشاء مساء الحادثة|صور الحفل مؤرخة','بريئة. كنت في عشاء عند صديقتك حتى 11:30 والصور مؤرخة.',['في عشاء عند صديقتي حتى الحادية عشرة والنصف.','زوجته الثانية منذ ست سنوات.','كان يضيق بإنفاقي، وهذا كل شيء.','لا، فلم أكن في البيت.','لأن صور الحفل مؤرخة.']),
P('عادل الشهري','محامي الضحية','العمر: 55 سنة|محاميه ومستشاره منذ خمسة عشر عاماً|يدير حساب أمانة لدى الضحية|يقود سيارة سوداء|حضر لتوقيع الوصية','أنت القاتل. اختلست من حساب الأمانة، وإبراهيم اكتشف ذلك وهدد بإبلاغ النقابة وحرمك من تنفيذ الوصية. وقّعتم الوصية 9:15، ثم أخذت الدواء بمفتاح من جيبه وخلطته في قهوته، وغسلت فنجانك وخرجت 9:42. تكذب بأنك غادرت 8:30.',['وقّعنا الوصية، وغادرت الفيلا الثامنة والنصف إلى بيتي.','محاميه ومستشاره منذ خمسة عشر عاماً.','لا، علاقتنا مهنية تماماً.','لا، كان هادئاً حين غادرت.','لأنني رجل قانون ولا أُقدم على جريمة.']),
P('رشيد البقمي','طاهي الفيلا','العمر: 45 سنة|يطهو للأسرة منذ عشر سنوات|غادر التاسعة|أعد القهوة بفنجانين|لا سوابق','بريء. أعددت فنجانين بطلب الضحية وغادرت التاسعة.',['أنهيت عملي التاسعة وغادرت.','أطهو له منذ عشر سنوات.','وبّخني أحياناً، فلا خلاف حقيقي.','أعددت فنجانين بطلبه قبل مغادرتي.','لأنني لم أدخل المكتب بعد تقديم القهوة.']),
P('سارة العنزي','ممرضة الضحية','العمر: 31 سنة|ممرضته الخاصة منذ سنة|تحفظ صندوق الدواء|انتهت مناوبتها التاسعة|تحمل مفتاحاً احتياطياً للصندوق في الدوام فقط','بريئة. أقفلت صندوق الدواء التاسعة وغادرت. لاحظت توتر المحامي.',['انتهت مناوبتي التاسعة، وأقفلت صندوق الدواء قبل مغادرتي.','ممرضته الخاصة منذ سنة.','لا، كان لطيفاً معي.','كان المحامي متوتراً على غير عادته.','لأن المفتاح كان عند الضحية لا عندي.']),
P('ماجد الحارس','حارس البوابة','العمر: 50 سنة|يحرس الفيلا منذ سنوات|يدوّن سجلاً للدخول والخروج','شاهد صادق: سجل خروج المحامي 9:42.',['في كشك البوابة طوال الليل.','أحرس الفيلا منذ سنوات.','لا أعلم.','سجلت خروج سيارة المحامي السوداء 9:42.','لأن السجل مكتوب بالتوقيت.']),
P('هنادي الخادمة','خادمة الفيلا','العمر: 36 سنة|تعمل منذ ثلاث سنوات|تنام في غرفة الخدم','شاهدة صادقة جزئياً: سمعت الشجار السابعة فقط.',['كنت في غرفتي بعد الثامنة.','أعمل في الفيلا منذ ثلاث سنوات.','سمعت صراخاً بين الأب وابنه قرابة السابعة.','لم أسمع شيئاً بعد التاسعة.','لأنني أروي ما سمعت فقط.']),
P('علي الجار','جار الفيلا','العمر: 58 سنة|جار الأسرة منذ عشرين سنة|يمشي مساءً','شاهد صادق: رأيت سيارة سوداء تغادر بعد 9:30 بقليل.',['كنت أمشي أمام الفيلا قرابة التاسعة والنصف.','جاره منذ عشرين سنة.','لا أعرف.','رأيت سيارة سوداء تغادر بعد التاسعة والنصف بقليل.','لأنني لا أعرف أحداً من أهل البيت جيداً.'])]});

CASES.push({
Q:['أين كنت بين منتصف الليل والثانية صباحاً؟','ما علاقتك برائد؟','هل كان بينكما أو بينه وبين أحد خلاف؟','هل رأيت أو سمعت شيئاً قرب المرسى؟','لماذا نصدقك؟'],
M:['غيرة وخلاف عاطفي','خلاف على الإرث','تنافس تجاري','تزوير عقد بيع أرض المنتجع وإخفاؤه','ابتزاز الضحية'],K:3,MK:3,WID:[5,6,7],
intro:intro('القضية الثالثة: ما لفظه البحر',['عند السادسة صباحاً عثر عامل نظافة على رائد المنصور، مالك منتجع «الواحة الزرقاء» في أبحر، طافياً قرب المرسى بعد ليلة حفل صاخبة. بدا الأمر غرقاً، لكن الطبيب الشرعي رفض هذا الظن.','رئتاه خاليتان من الماء، وفي مؤخرة رأسه جرح غائر، أي أنه قُتل ثم أُلقي في البحر قرابة الواحدة بعد منتصف الليل. وكان قد أخبر المقربين بأنه اكتشف شيئاً خطيراً في أوراق المنتجع.','الحفل ضم موظفين وضيوفاً، وكلهم مرّ قرب المرسى في وقت ما. التفاصيل الصغيرة هي المفتاح: من كان هناك حقاً، ومن يحمل علامة لا يعرف أنها عليه.'],'الصعوبة: أعلى من المتوسط بقليل، نحو 55 دقيقة.'),
scn:scn(2,'رصيف المرسى فجراً: الجثة قرب حافة الرصيف.','لقطة قريبة: مرساة حديدية صغيرة وخيط أزرق عالق بها.'),
cam:camc('CAM-04 المرسى','2026-10-29 01:08:41','p','رجل ببسترة زرقاء يحمل شيئاً ثقيلاً ويسير بخطى غير متوازنة نحو نهاية الرصيف، والوجه غير واضح.'),
SOL:'القاتل فيصل مدير المنتجع. باع أرضاً تابعة للمنتجع بعقد مزور لتوقيع رائد وقبض 750 ألفاً ظهرت في حسابه، وعندما اكتشف رائد الأمر دعاه إلى المرسى عبر الخط الإداري المشترك. الضربة بمرساة من زورق الصيانة عليها ألياف بسترة المنتجع، والكاميرا والحارس يريان رجلاً ببسترة زرقاء يعرج، وفيصل وحده يعرج. أما بدر فكان مع زبون الغوص، ودانة في غرفتها، وطلال سكران.',
FL:[['تقرير الطب الشرعي','الوفاة بضربة على مؤخرة الرأس بجسم صلب مستدير|لا ماء في الرئتين: ألقي بعد الوفاة|وقت الوفاة: بين 1:00 و1:30 صباحاً|لا مخدرات، وكحول بسيط|آثار دم جاف على الياقة'],['كشف الاتصالات (أسبوع)','الخط الإداري المشترك يستخدمه فيصل وبدر|الأحد: اتصال من رائد إلى مكتب توثيق 5 دقائق|الخميس 12:50: رسالة رائد إلى الخط الإداري|لا اتصال لدانة بعد 12:30'],['كشف الحساب البنكي (أسبوع)','رائد: لا حركات غير معتادة|حساب فيصل الشخصي: إيداع 750,000 قبل ثلاثة أيام من مصدر غير معروف|حساب المنتجع: لا عائدات بيع أرض'],['تقرير الأدلة الجنائية','ألياف المرساة: بوليستر أزرق من بسترات المنتجع|بصمات المرساة ممسوحة تماماً|قطرات زيت محرك على الرصيف مصدرها زورق الصيانة']],
EV:[['جرح الرأس','جرح غائر بجسم صلب مستدير، والغرق ليس سبب الوفاة لأن الرئتين خاليتان من الماء.'],['مرساة صغيرة','مرساة حديدية صغيرة من زورق قيد الصيانة عُثر عليها عند المرسى، وعليها شعيرات من قماش أزرق.'],['هاتف الضحية','آخر رسالة 12:50: «قابلني عند المرسى بعد قليل، عندي ما أريك إياه»، أُرسلت إلى الخط الإداري المشترك للمنتجع.'],['نسخة العقد','نسخة عقد بيع أرض تابعة للمنتجع في حقيبة الضحية، وتوقيعه عليها مزور ويختلف عن توقيعه الحقيقي.'],['بسترة المنتجع','كل الموظفين يرتدون بسترة زرقاء بشعار المنتجع، ومنهم فيصل وبدر وستة آخرون.']],
D:[P('بدر الحربي','مدرب الغوص','العمر: 30 سنة|سباح وغواص محترف|يستعمل الخط الإداري أحياناً|تشاجر مع الضحية منتصف الليل بسبب أجره|يرتدي بسترة المنتجع في العمل','بريء. كنت تغوص ليلياً مع زبون حتى 12:40، وتشاجرت مع رائد حول أجرك فقط.',['كنت أغوص مع زبون حتى 12:40 ثم عدت إلى غرفتي.','مدرب الغوص في المنتجع.','تشاجرنا منتصف الليل بسبب أجري المتأخر.','لا، فقد غادرت المرسى 12:40.','لأن زبون الغوص يشهد بوجودي معه.']),
P('دانة الرشيد','خطيبة الضحية','العمر: 28 سنة|خطيبته منذ سنة|غادرت الحفل 12:30|تقيم في غرفة بالمنتجع|سُجلت عودتها إلى غرفتها','بريئة. غادرت الحفل 12:30 بعد خلاف بسيط وبقيت في غرفتك.',['غادرت الحفل 12:30 إلى غرفتي.','خطيبته.','تخاصمنا قليلاً تلك الليلة بسبب السهر.','لا، فقد كنت وحدي في غرفتي.','لأن حارس الغرف سجل عودتي.']),
P('جاسر الدوسري','منافس تجاري','العمر: 47 سنة|يملك منتجعاً منافساً|حضر الحفل ضيفاً|غادر 12:15 مع سائقه|لا سوابق','بريء. غادرت 12:15 مع سائقك.',['غادرت الحفل 12:15 مع سائقي.','منافس تجاري، لكن علاقتنا محترمة.','نتنافس على العملاء، لا أكثر.','لا شيء.','لأن سائقي والبوابة يشهدان.']),
P('فيصل الأحمدي','مدير المنتجع','العمر: 43 سنة|مدير المنتجع منذ ست سنوات|يعاني إصابة قديمة في الركبة|يستعمل الخط الإداري|يملك مكتباً قرب الاستقبال','أنت القاتل. بعت أرضاً للمنتجع بعقد مزور وقبضت 750 ألفاً، وعندما اكتشف رائد ذلك دعاك للمرسى 1:00 فضربته بمرساة من زورق الصيانة وألقيته في البحر. ترتدي البسترة الزرقاء وتعرج قليلاً. تقول إنك كنت في مكتبك حتى الثانية.',['كنت في مكتبي أحاسب الحفل حتى الثانية.','مدير المنتجع منذ ست سنوات.','لا، كنا صديقين.','لا، فمكتبي بعيد عن المرسى.','لأنني الأكثر ولاءً للمنتجع.']),
P('رهف الشريف','صحفية','العمر: 32 سنة|مدعوة لتغطية الحفل|وعدها رائد بقصة كبيرة|غادرت 12:50 بسيارتها','بريئة. غادرت الحفل 12:50 وكاميرا البوابة تثبت ذلك.',['غادرت الحفل 12:50 بسيارتي.','صحفية دعاني رائد لتغطية مناسبة.','لا، لكنه وعدني بقصة كبيرة.','لا شيء قرب المرسى.','لأن كاميرا البوابة تثبت خروجي.']),
P('عبدالله الزهراني','حارس أمن','العمر: 40 سنة|يتجول بين المرسى والبوابة','شاهد صادق: رأيت موظفاً ببسترة زرقاء يتجه إلى المرسى قرابة الواحدة وكان يعرج قليلاً.',['كنت أتجول قرب المرسى والبوابة.','حارس أمن المنتجع.','لا أعلم.','رأيت موظفاً ببسترة زرقاء يتجه إلى المرسى قرابة الواحدة وكان يعرج قليلاً.','لأنني أروي ما رأيت دون أن أعرف وجهه.']),
P('نوف العتيبي','نادلة','العمر: 24 سنة|تخدم في الحفل','شاهدة صادقة: رأيت بدراً يتشاجر مع رائد منتصف الليل.',['كنت أخدم في الحفل حتى الواحدة.','نادلة في المنتجع.','رأيت بدراً يتشاجر معه منتصف الليل.','لا، فقد كنت داخل القاعة.','لأنني رأيت الشجار بنفسي.']),
P('طلال القرني','ضيف','العمر: 35 سنة|ضيف في الحفل|أفرط في الشراب','شاهد غير موثوق: سكران، تظن أنك رأيت دانة عند المرسى.',['كنت ضيفاً في الحفل وقد أفرطت في الشراب.','ضيف.','لا أذكر.','رأيت دانة عند المرسى قرابة الواحدة، أو ظننتها هي.','لأنني متأكد، أظن.'])]});

CASES.push({
Q:['أين كنت بين الحادية عشرة ومنتصف الليل؟','ما علاقتك بمروان؟','هل كان بينكما خلاف؟','هل رأيت أو سمعت شيئاً غريباً قرب المعرض؟','لماذا نصدقك؟'],
M:['غيرة فنية وخلاف على لوحة','إخفاء سرقة لوحة أصلية واستبدالها بنسخة مزورة','دَين مالي','انتقام من فصل','خلاف على الإرث'],K:4,MK:1,WID:[5,6,7],
intro:intro('القضية الرابعة: لوحة لا تشبه صاحبها',['بعد انتهاء حفل افتتاح معرض «ألوان الحجاز» في جدة، وُجد مروان العبدالله، مالك المعرض وتاجر اللوحات النادرة، ميتاً برصاصة في قاعة العرض قرابة منتصف الليل، وإلى جواره مصباح فوق بنفسجي ما زال دافئاً.','تعطلت كاميرات القاعة من 11:40 حتى 12:05، وسُجّل فتح نظام الإنذار برمز أحد المصرح لهم عند 11:52، والمسدس قطعة أثرية معروضة في المعرض لم تعد في واجهتها.','خمسة أشخاص عرفوا الضحية عن قرب وثلاثة شهود، وكلٌّ يروي بحسب هواه. تتشابك هنا الأرقام والأوقات والأكاذيب الصغيرة؛ فلا تثق بأول خيط وراجع الكشوف قبل أن تتهم.'],'الصعوبة: صعبة، نحو 75 دقيقة.'),
scn:scn(3,'قاعة العرض: الجثة أمام اللوحة المركزية والمكان شبه مظلم.','لقطة قريبة: المصباح فوق البنفسجي وإطار اللوحة المركزية.'),
cam:camc('CAM-01 قاعة العرض','2026-10-29 11:39:58','p','تتوقف اللقطات عند 11:40 وتعود 12:05 فلا يُرى شيء بينهما.'),
SOL:'القاتلة منال، شقيقة الضحية ومرمّمة لوحاته. باعت اللوحة الأصلية سراً وأودع المبلغ 2,100,000 في حسابها، وصنعت نسخة بدلها. اكتشف مروان الأمر بالمصباح فوق البنفسجي واتصل بها 11:20، فجاءت من الباب الخلفي 11:45 كما رأى مسعود، وأطفأت الإنذار برمزها 11:52، وهاتفها ظهر قرب المعرض خلافاً لقولها إنها نائمة. أما تميم فخرج 11:15 وهيفاء كاذبة، وريما ووليد غادرا قبل الحادثة.',
FL:[['تقرير الطب الشرعي','الوفاة برصاصة في الصدر، مسافة متوسطة|وقت الوفاة: 11:50–12:10|المقذوف من مسدس قديم الطراز عيار 38|لا مقاومة، والضحية كان واقفاً أمام اللوحة|المصباح كان في يده عند السقوط'],['كشف الاتصالات (أسبوع)','الجمعة 11:20: مروان إلى منال 4 دقائق|الأربعاء: مروان إلى مختبر ترميم 8 دقائق|ريما: اتصال بمروان 10:55 قبل مغادرتها|لا اتصالات بعد 11:25'],['مواقع الهواتف (أبراج الاتصال)','هاتف تميم: خرج من المنطقة 11:20|هاتف وليد: خرج 11:35|هاتف منال: ظهر على برج الحي قرب المعرض 11:50 وبقي إلى 12:20|هاتف ريما وكريم: ثابتان في أماكنهما'],['كشف الحساب البنكي (أسبوع)','مروان: لا شيء غريب|حساب منال: إيداع 2,100,000 قبل أربعة أسابيع من خارج البلاد|وليد: عربون 50,000 لمروان لم يُسترد']],
EV:[['المصباح فوق البنفسجي','مصباح فحص الأعمال ما زال دافئاً، وتحت ضوئه تظهر على اللوحة المركزية طبقات حديثة لا تتفق مع عمرها المعلن.'],['سجل الإنذار','تعطيل الإنذار 11:52 برمز المرمّمة الشخصي، وإعادة تفعيله 12:07.'],['المسدس الأثري','المسدس الأثري المعار من وليد غير موجود في واجهته، والواجهة لم تُكسر وفُتحت بمفتاح.'],['بصمات الإطار','بصمات تميم على إطار اللوحة المركزية، وهي قديمة متراكمة لا تحدد وقتاً.'],['وصل الشحن','وصل شحن لوحة إلى مشترٍ في الخارج قبل شهر، عليه توقيع يشبه خط مروان وليس خطه.']],
D:[P('تميم الخالدي','فنان تشكيلي','العمر: 36 سنة|يعرض لوحاته في المعرض|تشاجر مع مروان على السعر|غادر 11:15|بصماته على إطار اللوحة','بريء. غادرت 11:15، وبصماتك على الإطار قديمة.',['غادرت المعرض قرابة 11:15 إلى بيتي.','رسام أعرض لديه لوحاتي.','تشاجرنا على سعر لوحتي لكنه أصلح الأمر.','لا، لقد غادرت.','لأن هاتفي يثبت مكاني وعمر يشهد بخروجي.']),
P('ريما السعدي','مديرة المعرض','العمر: 34 سنة|تدير المعرض منذ ثلاث سنوات|تحمل مفتاح غرفة الكاميرات|غادرت 11:00','بريئة. غادرت 11:00 وسيارتك خرجت أمام حارس المبنى.',['غادرت قرابة 11:00 بعد الحفل.','أدير المعرض منذ ثلاث سنوات.','لا، كان صارماً لكنه عادل.','لا، فقد غادرت قبل الحادثة.','لأن حارس المبنى رأى سيارتي تخرج.']),
P('وليد القرني','جامع تحف','العمر: 55 سنة|يملك المسدس الأثري المعار|رفض مروان بيعه اللوحة المركزية|غادر 11:30','بريء. المسدس ملكك لكنك غادرت 11:30.',['غادرت 11:30 بعد حديث عن لوحة أرغب بشرائها.','جامع تحف أشتري منه بين حين وآخر.','رفض بيعي اللوحة المركزية ولم أحقد عليه.','لا، لكن المسدس كان معاراً من مجموعتي.','لأنني خرجت مع أوائل الضيوف.']),
P('كريم الصاعدي','حارس المعرض','العمر: 38 سنة|حارس المعرض منذ سنتين|يحمل مفتاح غرفة الكاميرات|كان في غرفة الحراسة','بريء. لم تبرح غرفة الحراسة بعد 11:30، وسمعت صوتاً ظننته الريح.',['تفقدت الباب الخلفي ثم نمت في غرفة الحراسة.','حارس المعرض منذ سنتين.','لا، كان يحسن معاملتي.','سمعت صوتاً قوياً كإغلاق باب وظننته الريح.','لأنني لم أبرح غرفة الحراسة بعد 11:30.']),
P('منال العبدالله','شقيقة الضحية','العمر: 41 سنة|شقيقته الصغرى|ترمم لوحات المعرض|تملك رمزاً شخصياً للإنذار|تعيش وحدها','أنت القاتلة. بعت اللوحة الأصلية سراً وأودع ثمنها في حسابك واستبدلتها بنسخة صنعتها. مروان اكتشف ذلك بالمصباح فاتصل بك 11:20. جئت من الباب الخلفي 11:45 ودخلت برمزك 11:52 وأخذت المسدس وقتلته. تدّعين أنك نمت منذ 10:45 وأن رمزك ربما استخدمه غيرك.',['كنت نائمة في بيتي منذ 10:45.','شقيقته الصغرى وأرمم لوحاته.','لا، لكنه كان قلقاً مؤخراً بشأن اللوحة المركزية.','لا شيء. أما رمزي فربما استخدمه غيري، فقد كتبته في دفتري.','لأنني أحبه، وهو أخي الوحيد.']),
P('مسعود الشمري','بائع شاي','العمر: 57 سنة|يبيع الشاي قرب المعرض ليلاً','شاهد صادق: رأيت امرأة بمعطف طويل تدخل من الباب الخلفي قرابة 11:45.',['أبيع الشاي قرب المعرض حتى منتصف الليل.','لا أعرفه.','لا.','رأيت امرأة بمعطف طويل تدخل من الباب الخلفي قرابة 11:45.','لأنني لا أعرف أحداً منهم.']),
P('هيفاء المالكي','جارة المعرض','العمر: 52 سنة|تسكن قبالة المعرض|على خلاف مع تميم بسبب الضجيج','شاهدة كاذبة بدافع الحقد: تدّعين أنك رأيت تميماً يركض قرابة 11:50، والحقيقة أنه غادر 11:15.',['كنت في شرفتي أراقب الشارع.','جارة المعرض.','تميم كان يمر ويصيح أحياناً.','رأيت تميماً يركض مبتعداً قرابة 11:50.','لأنني رأيته بعيني.']),
P('عمر الغامدي','أمن المبنى','العمر: 44 سنة|موظف أمن المبنى|يدوّن سجل خروج الزوار','شاهد صادق: سجلت خروج ريما 11:00 وتميم 11:15 ووليد 11:30.',['كنت في مكتب المبنى حتى 12:30.','موظف أمن المبنى.','لا أعلم.','سجلت خروج ريما 11:00 وتميم 11:15 ووليد 11:30.','لأن سجلي مكتوب بالتوقيت.'])]});
